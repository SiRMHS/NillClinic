# ==========================================================
# Nilforoushzadeh Clinic
#
# dash.nilforoushzadeh.clinic => Frontend :3000  (+ /api/ => :4000)
# api.nilforoushzadeh.clinic  => Backend API :4000
# sld.nilforoushzadeh.clinic  => External Jordan CRM
#
# Deployed copy: /etc/nginx/sites-available/nilforoushzadeh.clinic
# ==========================================================


# ==========================================================
# 1. Dashboard Frontend
# ==========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name dash.nilforoushzadeh.clinic;

    client_max_body_size 50m;

    access_log /var/log/nginx/dash.nilforoushzadeh.clinic.access.log;
    error_log  /var/log/nginx/dash.nilforoushzadeh.clinic.error.log;

    # ------------------------------------------------------
    # API under the dashboard's own origin.
    #
    # The session lives in an httpOnly cookie and every state-changing request
    # must echo the readable `jc_csrf` cookie back in a header. Served from
    # api.nilforoushzadeh.clinic that cookie is host-only on *that* hostname:
    # the browser still sends it (same site) but the dashboard's JavaScript
    # cannot read it, so the header is never set and every save answers 403
    # "درخواست نامعتبر است (CSRF)". Proxying the API here makes the two
    # same-origin, which is what the double-submit check assumes.
    #
    # Longer read timeout than the page routes: a CRM sync run holds the
    # request open well past the 120s the frontend needs.
    #
    # No Upgrade/Connection headers — the API speaks no WebSocket, and
    # forwarding a hop-by-hop upgrade it will not answer only invites trouble.
    # ------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_cache_bypass $http_upgrade;
    }
    ssl_certificate /etc/letsencrypt/live/dash.nilforoushzadeh.clinic/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dash.nilforoushzadeh.clinic/privkey.pem; # managed by Certbot

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

}


# ==========================================================
# 2. Main Backend API
#
# Kept for Bearer-token clients and scripts. The browser no longer comes here:
# the dashboard talks to https://dash.nilforoushzadeh.clinic/api/ instead.
# ==========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name api.nilforoushzadeh.clinic;

    client_max_body_size 50m;

    access_log /var/log/nginx/api.nilforoushzadeh.clinic.access.log;
    error_log  /var/log/nginx/api.nilforoushzadeh.clinic.error.log;

    # Backend health check
    location = /nginx-health {
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx-api"}';
    }

    # فقط بک‌اند اصلی پروژه
    location / {
        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        proxy_cache_bypass $http_upgrade;
    }
    ssl_certificate /etc/letsencrypt/live/dash.nilforoushzadeh.clinic/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dash.nilforoushzadeh.clinic/privkey.pem; # managed by Certbot

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

}


# ==========================================================
# External Jordan CRM
#
# Public:
# https://sld.nilforoushzadeh.clinic/api/Auth/Apilogin
#
# Upstream:
# http://192.168.175.15:8090/api/Auth/Apilogin
# ==========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name sld.nilforoushzadeh.clinic;

    client_max_body_size 50m;

    access_log /var/log/nginx/sld.nilforoushzadeh.clinic.access.log;
    error_log /var/log/nginx/sld.nilforoushzadeh.clinic.error.log;

    # صفحه اصلی به Swagger
    location = / {
        return 302 /swagger/index.html;
    }

    # تمام مسیرها بدون هیچ تغییر به Jordan CRM ارسال می‌شوند
    #
    # /api/Auth/Apilogin
    # =>
    # http://192.168.175.15:8090/api/Auth/Apilogin
    #
    # /swagger/index.html
    # =>
    # http://192.168.175.15:8090/swagger/index.html
    location / {
        proxy_pass http://192.168.175.15:8090;

        proxy_http_version 1.1;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_redirect http://192.168.175.15:8090/ https://sld.nilforoushzadeh.clinic/;
    }

    # خطوط SSL فعلی خودت را نگه دار
    ssl_certificate /etc/letsencrypt/live/dash.nilforoushzadeh.clinic/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.nilforoushzadeh.clinic/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}



# ==========================================================
# 4. HTTP => HTTPS redirects
# ==========================================================
server {
    if ($host = dash.nilforoushzadeh.clinic) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name dash.nilforoushzadeh.clinic;

    return 301 https://dash.nilforoushzadeh.clinic$request_uri;


}


server {
    if ($host = api.nilforoushzadeh.clinic) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name api.nilforoushzadeh.clinic;

    return 301 https://api.nilforoushzadeh.clinic$request_uri;


}


server {
    if ($host = sld.nilforoushzadeh.clinic) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name sld.nilforoushzadeh.clinic;

    return 301 https://sld.nilforoushzadeh.clinic$request_uri;


}
