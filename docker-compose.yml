version: "3.9"

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jordan-postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: jordan
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-jordan}
      POSTGRES_DB: jordan_dashboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jordan -d jordan_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    networks:
      - jordan-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-jordan}/jordan-api:${IMAGE_TAG:-latest}
    container_name: jordan-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://jordan:${DATABASE_PASSWORD:-jordan}@postgres:5432/jordan_dashboard?schema=public
      API_PORT: 4000
      API_URL: ${API_URL:-http://localhost:4000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JORDAN_API_BASE_URL: ${JORDAN_API_BASE_URL}
      JORDAN_API_USERNAME: ${JORDAN_API_USERNAME}
      JORDAN_API_PASSWORD: ${JORDAN_API_PASSWORD}
      JORDAN_API_COMPANY: ${JORDAN_API_COMPANY}
      SYNC_CRON_ENABLED: ${SYNC_CRON_ENABLED:-true}
      SYNC_CRON_SCHEDULE: ${SYNC_CRON_SCHEDULE:-0 */6 * * *}
      LEAD_WEBHOOK_SECRET: ${LEAD_WEBHOOK_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *logging
    networks:
      - jordan-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        BUILD_NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-jordan}/jordan-web:${IMAGE_TAG:-latest}
    container_name: jordan-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *logging
    networks:
      - jordan-network

  nginx:
    image: nginx:1.27-alpine
    container_name: jordan-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - api
      - web
    logging: *logging
    networks:
      - jordan-network

volumes:
  postgres-data:
    driver: local
  nginx-cache:
    driver: local

networks:
  jordan-network:
    driver: bridge
