# ─────────────────────────────────────────────────────────
# Jordan Clinic Dashboard — server compose (pull from GHCR)
#
# On the server:
#   1. Copy deploy/.env.production.example → .env and fill values
#   2. docker login ghcr.io -u YOUR_GITHUB_USER -p YOUR_GITHUB_TOKEN
#   3. docker compose pull && docker compose up -d 
# ─────────────────────────────────────────────────────────
version: "3.9"

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# GHCR image path = ghcr.io/<owner>/<repo>/jordan-{api|web}:<tag>
# Example repo "Deon/Nill" → GHCR_IMAGE_PREFIX=deon/nill
x-api-image: &api-image ghcr.io/${GHCR_IMAGE_PREFIX:-your-github-user/nill}/jordan-api:${IMAGE_TAG:-latest}
x-web-image: &web-image ghcr.io/${GHCR_IMAGE_PREFIX:-your-github-user/nill}/jordan-web:${IMAGE_TAG:-latest}

services:
  postgres:
    image: postgres:16-alpine
    container_name: jordan-postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: jordan
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-jordan}
      POSTGRES_DB: jordan_dashboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jordan -d jordan_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    networks:
      - jordan-network

  api:
    image: *api-image
    container_name: jordan-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://jordan:${DATABASE_PASSWORD:-jordan}@postgres:5432/jordan_dashboard?schema=public
      API_PORT: 4000
      API_URL: ${API_URL:-http://localhost:4000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      JORDAN_API_BASE_URL: ${JORDAN_API_BASE_URL:?JORDAN_API_BASE_URL is required}
      JORDAN_API_USERNAME: ${JORDAN_API_USERNAME:?JORDAN_API_USERNAME is required}
      JORDAN_API_PASSWORD: ${JORDAN_API_PASSWORD:?JORDAN_API_PASSWORD is required}
      JORDAN_API_COMPANY: ${JORDAN_API_COMPANY:-Jordan}
      SYNC_CRON_ENABLED: ${SYNC_CRON_ENABLED:-true}
      SYNC_CRON_SCHEDULE: ${SYNC_CRON_SCHEDULE:-0 */6 * * *}
      LEAD_WEBHOOK_SECRET: ${LEAD_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging: *logging
    networks:
      - jordan-network

  web:
    image: *web-image
    container_name: jordan-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging: *logging
    networks:
      - jordan-network

  nginx:
    image: nginx:1.27-alpine
    container_name: jordan-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *logging
    networks:
      - jordan-network

volumes:
  postgres-data:
    driver: local
  nginx-cache:
    driver: local

networks:
  jordan-network:
    driver: bridge
