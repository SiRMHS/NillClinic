name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # تگ ایمیج — روی سرور در .env همان مقدار را برای IMAGE_TAG بگذار
  PACKAGE_TAG: "1.2"
  NODE_VERSION: "20"
  PNPM_VERSION: "10.14.0"

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Downcase repository name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/jordan-api:${{ env.PACKAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/jordan-api:latest

      - name: Build and Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_NEXT_PUBLIC_API_URL=__NEXT_PUBLIC_API_URL_PLACEHOLDER__
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/jordan-web:${{ env.PACKAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/jordan-web:latest

      - name: Summary
        run: |
          echo "## Images pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| API | \`${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/jordan-api:${{ env.PACKAGE_TAG }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Web | \`${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/jordan-web:${{ env.PACKAGE_TAG }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "On the server set in \`.env\`:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`GHCR_IMAGE_PREFIX=${{ env.REPO_LOWER }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`IMAGE_TAG=${{ env.PACKAGE_TAG }}\`" >> "$GITHUB_STEP_SUMMARY"
