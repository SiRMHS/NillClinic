name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (default: main-<sha>)"
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.14.0"
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ inputs.tag || format('{0}-{1}', github.ref_name, github.sha) }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: api
            dockerfile: Dockerfile.api
          - name: web
            dockerfile: Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: |
          pnpm --filter @jordan/shared build
          pnpm --filter @jordan/db build
          pnpm --filter @jordan/db generate
          pnpm --filter @jordan/sync-engine build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/jordan-${{ matrix.service.name }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.service.name == 'web' && format('BUILD_NEXT_PUBLIC_API_URL={0}', secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000') || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Create .env on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /opt/jordan-dashboard/deploy
            cat > /opt/jordan-dashboard/.env << 'EOF'
            IMAGE_TAG=${{ env.IMAGE_TAG }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN || '24h' }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            JORDAN_API_BASE_URL=${{ secrets.JORDAN_API_BASE_URL }}
            JORDAN_API_USERNAME=${{ secrets.JORDAN_API_USERNAME }}
            JORDAN_API_PASSWORD=${{ secrets.JORDAN_API_PASSWORD }}
            JORDAN_API_COMPANY=${{ secrets.JORDAN_API_COMPANY }}
            SYNC_CRON_ENABLED=${{ secrets.SYNC_CRON_ENABLED || 'true' }}
            SYNC_CRON_SCHEDULE=${{ secrets.SYNC_CRON_SCHEDULE || '0 */6 * * *' }}
            LEAD_WEBHOOK_SECRET=${{ secrets.LEAD_WEBHOOK_SECRET }}
            API_URL=${{ secrets.API_URL || '' }}
            WEB_ORIGIN=${{ secrets.WEB_ORIGIN || '' }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || '' }}
            EOF

      - name: Copy docker-compose & nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,deploy/nginx.conf"
          target: /opt/jordan-dashboard/

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/jordan-dashboard
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sleep 10
            curl -sf http://localhost:4000/health && echo "API healthy" || echo "API health check failed"
