name: Build and Push Packages Only

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # تگ پکیج‌ها را اینجا ست کن تا موقع دانلود روی مک دقیقاً بدانی چه نسخه‌ای است
  PACKAGE_TAG: "1.0"

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.14.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # تبدیل نام ریپازیتوری به حروف کاملاً کوچک برای استاندارد داکر
      - name: Downcase repository name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # ۱. بیلد و آپلود پکیج بک‌آند (API)
      # ========================================================
      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/jordan-api:${{ env.PACKAGE_TAG }}

      # ========================================================
      # ۲. بیلد و آپلود پکیج فرانت‌آند (Web)
      # ========================================================
      - name: Build and Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/jordan-web:${{ env.PACKAGE_TAG }}